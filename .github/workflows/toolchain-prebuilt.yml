name: Publish toolchain prebuilt

on:
  push:
    tags:
      - "toolchain-prebuilt/**"

permissions:
  contents: read

concurrency:
  group: toolchain-prebuilt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish toolchain prebuilt
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout with toolchain assets
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Publish toolchain prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/toolchain-prebuilt-publish.sh
