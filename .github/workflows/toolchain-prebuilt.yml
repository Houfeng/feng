name: Publish toolchain prebuilt

on:
  push:
    tags:
      - "toolchain-prebuilt/**"

permissions:
  contents: read

concurrency:
  group: toolchain-prebuilt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish toolchain prebuilt
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout with toolchain assets
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Package toolchain prebuilt
        id: package
        run: scripts/toolchain-prebuilt-publish.sh

      - name: Upload toolchain prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          VERSION="${TAG#toolchain-prebuilt/}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSET}"
          else
            gh release create "${TAG}" "${ASSET}" \
              --verify-tag \
              --latest=false \
              --title="Feng toolchain prebuilt ${VERSION}" \
              --notes="Feng toolchain prebuilt ${VERSION}."
          fi
