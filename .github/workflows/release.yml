name: CI and Release

on:
  push:
    branches:
      - "**"
  create:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve build version
    if: >-
      github.event_name != 'create' ||
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Resolve build version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: >-
          scripts/release_version.sh resolve
          --event-name="${EVENT_NAME}"
          --ref-type="${REF_TYPE}"
          --ref-name="${REF_NAME}"
          --output="${GITHUB_OUTPUT}"

  component_macos:
    name: Test and build macos-arm64
    needs: prepare
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout with release assets
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install macOS build environment
        run: brew install coreutils llvm@21

      - name: Configure build version
        run: scripts/release_version.sh set --version="${{ needs.prepare.outputs.version }}"

      - name: Configure and verify macOS build environment
        run: >-
          scripts/release_ci_environment.sh
          --platform=macos-arm64
          --path-output="${GITHUB_PATH}"

      - name: Run full regression
        run: make test

      - name: Create native release component
        if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        run: >-
          scripts/release_component.sh
          --platform=macos-arm64
          --archive=build/release-component-macos-arm64.tar

      - name: Upload native release component
        if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-component-macos-arm64
          path: build/release-component-macos-arm64.tar
          if-no-files-found: error
          compression-level: 0

  component_linux:
    name: Test and build ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-latest
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:26.04
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Install Ubuntu build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >-
          apt-get update &&
          apt-get install -y --no-install-recommends
          binutils ca-certificates clang file git git-lfs libc6-dev
          libclang-rt-dev lld make nodejs unzip zip

      - name: Checkout with release assets
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Configure build version
        run: scripts/release_version.sh set --version="${{ needs.prepare.outputs.version }}"

      - name: Verify Ubuntu build environment
        run: scripts/release_ci_environment.sh --platform="${{ matrix.platform }}"

      - name: Run full regression
        run: make test

      - name: Create native release component
        if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        run: >-
          scripts/release_component.sh
          --platform="${{ matrix.platform }}"
          --archive="build/release-component-${{ matrix.platform }}.tar"

      - name: Upload native release component
        if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-component-${{ matrix.platform }}
          path: build/release-component-${{ matrix.platform }}.tar
          if-no-files-found: error
          compression-level: 0

  bundled_packages:
    name: Build bundled packages
    if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install Ubuntu build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >-
          apt-get update &&
          apt-get install -y --no-install-recommends
          binutils ca-certificates clang file git git-lfs libc6-dev
          libclang-rt-dev lld make nodejs unzip zip

      - name: Checkout with release assets
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Configure build version
        run: scripts/release_version.sh set --version="${{ needs.prepare.outputs.version }}"

      - name: Verify Ubuntu build environment
        run: scripts/release_ci_environment.sh --platform=linux-x64-gnu

      - name: Build bundled packages
        run: >-
          scripts/release_bundled_packages.sh
          --output=build/release-bundled-packages

      - name: Upload bundled packages
        uses: actions/upload-artifact@v7
        with:
          name: release-bundled-packages
          path: build/release-bundled-packages/*.fb
          if-no-files-found: error
          compression-level: 0

  assemble:
    name: Assemble release packages
    if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    needs:
      - prepare
      - component_macos
      - component_linux
      - bundled_packages
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install Ubuntu assembly environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >-
          apt-get update &&
          apt-get install -y --no-install-recommends
          binutils ca-certificates file git git-lfs unzip zip

      - name: Checkout with release assets
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Configure build version
        run: scripts/release_version.sh set --version="${{ needs.prepare.outputs.version }}"

      - name: Download native release components
        uses: actions/download-artifact@v8
        with:
          pattern: release-component-*
          path: build/release-component-archives
          merge-multiple: true

      - name: Download bundled packages
        uses: actions/download-artifact@v8
        with:
          name: release-bundled-packages
          path: build/release-bundled-packages

      - name: Assemble release packages
        run: >-
          scripts/release_assemble.sh
          --version="${{ needs.prepare.outputs.version }}"
          --component-archives=build/release-component-archives
          --packages=build/release-bundled-packages
          --output=build/release-packages
          --archive-tool=toolchain/llvm/linux-x64-gnu/bin/llvm-ar

      - name: Upload unsigned release packages
        uses: actions/upload-artifact@v7
        with:
          name: release-packages-unsigned
          path: build/release-packages/*.zip
          if-no-files-found: error
          compression-level: 0

  finalize_macos:
    name: Sign and notarize macos-arm64 package
    if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    needs:
      - prepare
      - assemble
    runs-on: macos-26
    environment: release-signing
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout macOS finalization script
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Download unsigned release packages
        uses: actions/download-artifact@v8
        with:
          name: release-packages-unsigned
          path: build/release-packages-unsigned

      - name: Install macOS release credentials
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          certificate_path="${RUNNER_TEMP}/developer-id-application.p12"
          notary_key_path="${RUNNER_TEMP}/notary-api-key.p8"
          keychain_path="${RUNNER_TEMP}/release-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "${MACOS_SIGNING_P12_BASE64}" |
            base64 --decode -o "${certificate_path}"
          printf '%s' "${APPLE_NOTARY_KEY_P8_BASE64}" |
            base64 --decode -o "${notary_key_path}"
          chmod 0600 "${certificate_path}" "${notary_key_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -P "${MACOS_SIGNING_P12_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychain -d user -s "${keychain_path}"

          signing_identity="$(
            security find-identity -v -p codesigning "${keychain_path}" |
              awk -F '"' -v team="(${APPLE_TEAM_ID})" \
                '$2 ~ /^Developer ID Application:/ &&
                 index($2, team) > 0 { print $2 }'
          )"
          [[ -n "${signing_identity}" && "${signing_identity}" != *$'\n'* ]] || {
            echo "error: expected exactly one Developer ID Application identity for ${APPLE_TEAM_ID}" >&2
            exit 1
          }
          printf 'MACOS_SIGNING_IDENTITY=%s\n' "${signing_identity}" \
            >> "${GITHUB_ENV}"
          printf 'MACOS_NOTARY_KEY_PATH=%s\n' "${notary_key_path}" \
            >> "${GITHUB_ENV}"

      - name: Finalize release packages
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          unsigned_root="build/release-packages-unsigned"
          version="${{ needs.prepare.outputs.version }}"
          expected_archives=(
            "feng-${version}-macos-arm64.zip"
            "feng-${version}-linux-x64-gnu.zip"
            "feng-${version}-linux-arm64-gnu.zip"
          )
          [[ "$(
            find "${unsigned_root}" -maxdepth 1 -type f -name '*.zip' |
              wc -l |
              tr -d ' '
          )" == "${#expected_archives[@]}" ]] || {
            echo "error: unsigned release artifact must contain exactly three zip files" >&2
            exit 1
          }
          for archive_name in "${expected_archives[@]}"; do
            unzip -tqq "${unsigned_root}/${archive_name}" || {
              echo "error: missing or invalid unsigned release archive: ${archive_name}" >&2
              exit 1
            }
          done

          mkdir -p build/release-packages
          cp \
            "${unsigned_root}/feng-${version}-linux-x64-gnu.zip" \
            "${unsigned_root}/feng-${version}-linux-arm64-gnu.zip" \
            build/release-packages/
          scripts/release_finalize_macos.sh \
            --archive="${unsigned_root}/feng-${version}-macos-arm64.zip" \
            --output="build/release-packages/feng-${version}-macos-arm64.zip" \
            --version="${version}" \
            --identity="${MACOS_SIGNING_IDENTITY}" \
            --team-id="${APPLE_TEAM_ID}" \
            --notary-key="${MACOS_NOTARY_KEY_PATH}" \
            --notary-key-id="${APPLE_NOTARY_KEY_ID}" \
            --notary-issuer-id="${APPLE_NOTARY_ISSUER_ID}"

      - name: Upload finalized release packages
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: build/release-packages/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Remove macOS release credentials
        if: ${{ always() }}
        run: |
          security delete-keychain \
            "${RUNNER_TEMP}/release-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "${RUNNER_TEMP}/developer-id-application.p12" \
            "${RUNNER_TEMP}/notary-api-key.p8"

  verify_macos:
    name: Verify macos-arm64 package
    if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    needs:
      - prepare
      - finalize_macos
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Install macOS build environment
        run: brew install coreutils llvm@21

      - name: Configure and verify macOS build environment
        run: >-
          scripts/release_ci_environment.sh
          --platform=macos-arm64
          --path-output="${GITHUB_PATH}"

      - name: Download complete release packages
        uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: build/release-packages

      - name: Verify clean installation
        run: >-
          scripts/release_verify_install.sh
          --archive="build/release-packages/feng-${{ needs.prepare.outputs.version }}-macos-arm64.zip"
          --version="${{ needs.prepare.outputs.version }}"

  verify_linux:
    name: Verify ${{ matrix.platform }} package
    if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    needs:
      - prepare
      - finalize_macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-latest
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:26.04
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Install Ubuntu verification environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >-
          apt-get update &&
          apt-get install -y --no-install-recommends
          binutils ca-certificates clang file git git-lfs libc6-dev
          libclang-rt-dev lld make nodejs unzip zip

      - name: Checkout verification scripts
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Verify Ubuntu build environment
        run: scripts/release_ci_environment.sh --platform="${{ matrix.platform }}"

      - name: Download complete release packages
        uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: build/release-packages

      - name: Verify clean installation
        run: >-
          scripts/release_verify_install.sh
          --archive="build/release-packages/feng-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.zip"
          --version="${{ needs.prepare.outputs.version }}"

  publish:
    name: Publish GitHub Release
    if: needs.prepare.outputs.release == 'true'
    needs:
      - prepare
      - verify_macos
      - verify_linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout publication script
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Download verified release packages
        uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: build/release-packages

      - name: Publish verified tag assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          scripts/release_publish_github.sh
          --tag="${{ needs.prepare.outputs.tag }}"
          --version="${{ needs.prepare.outputs.version }}"
          --packages=build/release-packages
