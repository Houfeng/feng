name: CI and Release

on:
  push:
    branches:
      - "**"
  create:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve build version
    if: >-
      github.event_name != 'create' ||
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Resolve and validate build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag=""
          is_release=false
          if [[ "${GITHUB_EVENT_NAME}" == "create" &&
                "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
              echo "error: invalid release tag: ${tag}" >&2
              exit 1
            fi
            version="${tag#v}"
            is_release=true
          else
            version="$(sed -n '1p' VERSION)"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "error: invalid build version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "release=${is_release}" >> "${GITHUB_OUTPUT}"

  component:
    name: Test and build ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-14
          - platform: linux-x64-gnu
            runner: ubuntu-latest
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout with release assets
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Configure build version
        shell: bash
        run: printf '%s\n' "${{ needs.prepare.outputs.version }}" > VERSION

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils clang file make python3 zip unzip

      - name: Run full regression
        shell: bash
        run: make test

      - name: Stage native release component
        if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          scripts/release_component.sh \
            --platform="${{ matrix.platform }}" \
            --output=build/release-component
          tar -cf "build/release-component-${{ matrix.platform }}.tar" \
            -C build/release-component \
            "${{ matrix.platform }}"

      - name: Upload native release component
        if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-component-${{ matrix.platform }}
          path: build/release-component-${{ matrix.platform }}.tar
          if-no-files-found: error
          compression-level: 0

  assemble:
    name: Assemble release packages
    if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    needs:
      - prepare
      - component
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with release assets
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Configure build version
        shell: bash
        run: printf '%s\n' "${{ needs.prepare.outputs.version }}" > VERSION

      - name: Install assembly dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils file zip

      - name: Download native release components
        uses: actions/download-artifact@v8
        with:
          pattern: release-component-*
          path: build/release-component-tars
          merge-multiple: true

      - name: Extract and assemble release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-components build/release-packages
          for archive in build/release-component-tars/*.tar; do
            tar -xf "${archive}" -C build/release-components
          done
          scripts/release.sh \
            --version="${{ needs.prepare.outputs.version }}" \
            --components=build/release-components \
            --output=build/release-packages \
            --archive-tool=toolchain/llvm/linux-x64-gnu/bin/llvm-ar

      - name: Upload complete release packages
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: build/release-packages/*.zip
          if-no-files-found: error
          compression-level: 0

  verify:
    name: Verify ${{ matrix.platform }} package
    if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    needs:
      - prepare
      - assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-14
          - platform: linux-x64-gnu
            runner: ubuntu-latest
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Install Linux verification dependencies
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y file python3 unzip

      - name: Download complete release packages
        uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: build/release-packages

      - name: Verify clean installation
        shell: bash
        run: |
          set -euo pipefail
          package="feng-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}"
          mkdir -p build/release-install
          unzip -q "build/release-packages/${package}.zip" \
            -d build/release-install
          scripts/verify_release_install.sh \
            --root="build/release-install/${package}" \
            --version="${{ needs.prepare.outputs.version }}"

  publish:
    name: Publish GitHub Release
    if: needs.prepare.outputs.release == 'true'
    needs:
      - prepare
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release packages
        uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: release-packages

      - name: Publish verified tag assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          expected_prerelease=false
          release_flags=(
            --verify-tag
            --generate-notes
            --title "Feng ${{ needs.prepare.outputs.version }}"
          )
          if [[ "${{ needs.prepare.outputs.version }}" == *-* ]]; then
            expected_prerelease=true
            release_flags+=(--prerelease)
          fi
          if release_state="$(gh release view "${tag}" \
            --json isDraft,isImmutable,isPrerelease \
            --jq '[.isDraft, .isImmutable, .isPrerelease] | @tsv' \
            2>/dev/null)"; then
            read -r is_draft is_immutable is_prerelease <<< "${release_state}"
            [[ "${is_immutable}" == "false" ]] || {
              echo "error: existing GitHub Release is immutable: ${tag}" >&2
              exit 1
            }
            [[ "${is_prerelease}" == "${expected_prerelease}" ]] || {
              echo "error: existing GitHub Release prerelease state does not match ${tag}" >&2
              exit 1
            }
            gh release upload "${tag}" release-packages/*.zip
            if [[ "${is_draft}" == "true" ]]; then
              gh release edit "${tag}" --draft=false
            fi
          else
            gh release create "${tag}" \
              release-packages/*.zip \
              "${release_flags[@]}"
          fi
