name: CI and Release

on:
  push:
    branches:
      - "**"
  create:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve build version
    if: >-
      github.event_name != 'create' ||
      (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Resolve build version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: >-
          scripts/release_version.sh resolve
          --event-name="${EVENT_NAME}"
          --ref-type="${REF_TYPE}"
          --ref-name="${REF_NAME}"
          --output="${GITHUB_OUTPUT}"

  component_macos:
    name: Test and build macos-arm64
    needs: prepare
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout with release assets
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install macOS build environment
        run: brew install coreutils llvm@21

      - name: Configure build version
        run: scripts/release_version.sh set --version="${{ needs.prepare.outputs.version }}"

      - name: Configure and verify macOS build environment
        run: >-
          scripts/release_ci_environment.sh
          --platform=macos-arm64
          --path-output="${GITHUB_PATH}"

      - name: Run full regression
        run: make test

      - name: Create native release component
        if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        run: >-
          scripts/release_component.sh
          --platform=macos-arm64
          --archive=build/release-component-macos-arm64.tar

      - name: Upload native release component
        if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-component-macos-arm64
          path: build/release-component-macos-arm64.tar
          if-no-files-found: error
          compression-level: 0

  component_linux:
    name: Test and build ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-latest
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:26.04
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Install Ubuntu build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >-
          apt-get update &&
          apt-get install -y --no-install-recommends
          binutils ca-certificates clang file git git-lfs libc6-dev
          libclang-rt-dev lld make nodejs unzip zip

      - name: Checkout with release assets
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Configure build version
        run: scripts/release_version.sh set --version="${{ needs.prepare.outputs.version }}"

      - name: Verify Ubuntu build environment
        run: scripts/release_ci_environment.sh --platform="${{ matrix.platform }}"

      - name: Run full regression
        run: make test

      - name: Create native release component
        if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        run: >-
          scripts/release_component.sh
          --platform="${{ matrix.platform }}"
          --archive="build/release-component-${{ matrix.platform }}.tar"

      - name: Upload native release component
        if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-component-${{ matrix.platform }}
          path: build/release-component-${{ matrix.platform }}.tar
          if-no-files-found: error
          compression-level: 0

  bundled_packages:
    name: Build bundled packages
    if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install Ubuntu build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >-
          apt-get update &&
          apt-get install -y --no-install-recommends
          binutils ca-certificates clang file git git-lfs libc6-dev
          libclang-rt-dev lld make nodejs unzip zip

      - name: Checkout with release assets
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Configure build version
        run: scripts/release_version.sh set --version="${{ needs.prepare.outputs.version }}"

      - name: Verify Ubuntu build environment
        run: scripts/release_ci_environment.sh --platform=linux-x64-gnu

      - name: Build bundled packages
        run: >-
          scripts/release_bundled_packages.sh
          --output=build/release-bundled-packages

      - name: Upload bundled packages
        uses: actions/upload-artifact@v7
        with:
          name: release-bundled-packages
          path: build/release-bundled-packages/*.fb
          if-no-files-found: error
          compression-level: 0

  assemble:
    name: Assemble release packages
    if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    needs:
      - prepare
      - component_macos
      - component_linux
      - bundled_packages
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install Ubuntu assembly environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >-
          apt-get update &&
          apt-get install -y --no-install-recommends
          binutils ca-certificates file git git-lfs unzip zip

      - name: Checkout with release assets
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Configure build version
        run: scripts/release_version.sh set --version="${{ needs.prepare.outputs.version }}"

      - name: Download native release components
        uses: actions/download-artifact@v8
        with:
          pattern: release-component-*
          path: build/release-component-archives
          merge-multiple: true

      - name: Download bundled packages
        uses: actions/download-artifact@v8
        with:
          name: release-bundled-packages
          path: build/release-bundled-packages

      - name: Assemble release packages
        run: >-
          scripts/release_assemble.sh
          --version="${{ needs.prepare.outputs.version }}"
          --component-archives=build/release-component-archives
          --packages=build/release-bundled-packages
          --output=build/release-packages
          --archive-tool=toolchain/llvm/linux-x64-gnu/bin/llvm-ar

      - name: Upload complete release packages
        uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: build/release-packages/*.zip
          if-no-files-found: error
          compression-level: 0

  verify_macos:
    name: Verify macos-arm64 package
    if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    needs:
      - prepare
      - assemble
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Install macOS build environment
        run: brew install coreutils llvm@21

      - name: Configure and verify macOS build environment
        run: >-
          scripts/release_ci_environment.sh
          --platform=macos-arm64
          --path-output="${GITHUB_PATH}"

      - name: Download complete release packages
        uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: build/release-packages

      - name: Verify clean installation
        run: >-
          scripts/release_verify_install.sh
          --archive="build/release-packages/feng-${{ needs.prepare.outputs.version }}-macos-arm64.zip"
          --version="${{ needs.prepare.outputs.version }}"

  verify_linux:
    name: Verify ${{ matrix.platform }} package
    if: needs.prepare.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    needs:
      - prepare
      - assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            runner: ubuntu-latest
          - platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:26.04
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Install Ubuntu verification environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >-
          apt-get update &&
          apt-get install -y --no-install-recommends
          binutils ca-certificates clang file git git-lfs libc6-dev
          libclang-rt-dev lld make nodejs unzip zip

      - name: Checkout verification scripts
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Verify Ubuntu build environment
        run: scripts/release_ci_environment.sh --platform="${{ matrix.platform }}"

      - name: Download complete release packages
        uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: build/release-packages

      - name: Verify clean installation
        run: >-
          scripts/release_verify_install.sh
          --archive="build/release-packages/feng-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.zip"
          --version="${{ needs.prepare.outputs.version }}"

  publish:
    name: Publish GitHub Release
    if: needs.prepare.outputs.release == 'true'
    needs:
      - prepare
      - verify_macos
      - verify_linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout publication script
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Download verified release packages
        uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: build/release-packages

      - name: Publish verified tag assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          scripts/release_publish_github.sh
          --tag="${{ needs.prepare.outputs.tag }}"
          --version="${{ needs.prepare.outputs.version }}"
          --packages=build/release-packages
